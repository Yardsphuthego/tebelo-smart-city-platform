services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: tebelo
      POSTGRES_USER: tebelo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tebelo -d tebelo"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  web:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
  delivery-engine:
    build: .
    env_file: .env
    depends_on:
      web:
        condition: service_healthy
    command: sh -c "set -e; while true; do python manage.py process_delivery_engine; sleep 60; done"
    restart: unless-stopped
volumes:
  postgres_data:
  media_data:

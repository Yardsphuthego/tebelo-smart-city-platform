{% for field in form %}<div class="field{% if field.errors %} field-error{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}<label class="check">{{ field }} <span>{{ field.label }}</span></label>{% else %}<label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span aria-hidden="true"> *</span>{% endif %}</label>{{ field }}{% endif %}
  {% if field.help_text %}<div class="help">{{ field.help_text|safe }}</div>{% endif %}{% for error in field.errors %}<div class="error">{{ error }}</div>{% endfor %}
</div>{% endfor %}
